<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #121212; overflow: hidden; }
  #terms { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .term {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    padding: 4px; box-sizing: border-box; display: none;
  }
  .term.active { display: block; }
</style>
</head>
<body>
<div id="terms"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script>
  // id -> { term, fit, div }
  const terms = new Map();
  let activeId = null;

  // 选择模式
  let selectMode = false;
  let dragStart = null;

  // 桥接兜底：桥未注入时不报错
  function call(fn) {
    var b = window.Android;
    if (!b || typeof b[fn] !== 'function') return;
    try { b[fn].apply(b, Array.prototype.slice.call(arguments, 1)); } catch (e) {}
  }

  function createTerm(rawId) {
    const id = String(rawId);
    if (terms.has(id)) return;

    const div = document.createElement('div');
    div.className = 'term';
    document.getElementById('terms').appendChild(div);

    const term = new Terminal({
      fontSize: 13,
      fontFamily: 'monospace',
      cursorBlink: true,
      scrollback: 5000,
      theme: { background: '#121212', foreground: '#d4d4d4' }
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(div);

    const ta = term.textarea;
    if (ta) {
      ta.setAttribute('autocorrect', 'off');
      ta.setAttribute('autocapitalize', 'off');
      ta.setAttribute('autocomplete', 'off');
      ta.setAttribute('spellcheck', 'false');
    }

    term.onData(function (d) { call('input', id, d); });

    terms.set(id, { term: term, fit: fit, div: div });

    if (activeId === null) {
      activeId = id;
      div.classList.add('active');
      try { fit.fit(); } catch (e) {}
      term.focus();
    } else {
      try { fit.fit(); } catch (e) {}
    }

    call('ready', id, term.cols, term.rows);
  }

  function switchTerm(rawId) {
    const id = String(rawId);
    const t = terms.get(id);
    if (!t) return;
    activeId = id;
    terms.forEach(function (v, k) {
      if (k === id) v.div.classList.add('active');
      else v.div.classList.remove('active');
    });
    try { t.fit.fit(); } catch (e) {}
    t.term.focus();
    call('resize', id, t.term.cols, t.term.rows);
  }

  function closeTerm(rawId) {
    const id = String(rawId);
    const t = terms.get(id);
    if (!t) return;
    try { t.term.dispose(); } catch (e) {}
    t.div.remove();
    terms.delete(id);
    if (activeId === id) activeId = null;
  }

  // 输出：Kotlin -> base64 字节 -> xterm
  function w(rawId, b64) {
    const t = terms.get(String(rawId));
    if (!t) return;
    const s = atob(b64);
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    t.term.write(u);
  }

  function pasteActive(text) {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (t) t.term.paste(text);
  }

  function clearActive() {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (t) t.term.clear();
  }

  function copyAllActive() {
    if (activeId === null) { call('onToast', '没有终端'); return; }
    const t = terms.get(activeId);
    if (!t) return;
    t.term.selectAll();
    const s = t.term.getSelection();
    t.term.clearSelection();
    if (s) call('onSelection', s);
    else call('onToast', '无内容可复制');
  }

  function copySelectionActive() {
    if (activeId === null) { call('onToast', '没有终端'); return; }
    const t = terms.get(activeId);
    if (!t) return;
    const s = t.term.getSelection();
    if (s) call('onSelection', s);
    else call('onToast', '没有选中内容，先拖动选择');
  }

  function arrowActive(c) {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (!t) return;
    var app = t.term.modes.applicationCursorKeysMode;
    if (app === undefined) app = t.term.modes.applicationCursorKeys;
    call('key', activeId, (app ? '\x1bO' : '\x1b[') + c);
  }

  function fontDeltaActive(d) {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (!t) return;
    const s = Math.max(8, Math.min(28, t.term.options.fontSize + d));
    t.term.options.fontSize = s;
    try { t.fit.fit(); } catch (e) {}
    call('resize', activeId, t.term.cols, t.term.rows);
  }

  // ------------------------ 选择模式 ------------------------

  function enterSelectMode() {
    if (activeId === null) return;
    selectMode = true;
    dragStart = null;
    const t = terms.get(activeId);
    if (t) {
      try { t.term.clearSelection(); } catch (e) {}
      t.term.focus();
    }
  }

  function exitSelectMode() {
    selectMode = false;
    dragStart = null;
    if (activeId !== null) {
      const t = terms.get(activeId);
      if (t) {
        try { t.term.clearSelection(); } catch (e) {}
      }
    }
  }

  // 把屏幕坐标换算成 (col, bufferRow)
  function posFromPoint(x, y) {
    if (activeId === null) return null;
    const t = terms.get(activeId);
    if (!t) return null;
    // xterm-screen 是精确的文本网格区域
    const screen = t.term.element.querySelector('.xterm-screen');
    if (!screen) return null;
    const rect = screen.getBoundingClientRect();
    const cols = t.term.cols;
    const rows = t.term.rows;
    if (cols <= 0 || rows <= 0) return null;
    const cellW = rect.width / cols;
    const cellH = rect.height / rows;
    if (cellW <= 0 || cellH <= 0) return null;
    let col = Math.floor((x - rect.left) / cellW);
    let row = Math.floor((y - rect.top) / cellH);
    if (col < 0) col = 0;
    if (col > cols - 1) col = cols - 1;
    if (row < 0) row = 0;
    if (row > rows - 1) row = rows - 1;
    // 换算到 buffer 绝对行，滚动过也不偏
    const bufferRow = row + t.term.buffer.active.viewportY;
    return { col: col, row: bufferRow };
  }

  function applySelection(term, a, b) {
    const cols = term.cols;
    let c1 = a.col, r1 = a.row;
    let c2 = b.col, r2 = b.row;
    if (r1 > r2 || (r1 === r2 && c1 > c2)) {
      const tc = c1, tr = r1;
      c1 = c2; r1 = r2;
      c2 = tc; r2 = tr;
    }
    const length = (r2 - r1) * cols + (c2 - c1) + 1;
    if (length > 0) {
      try { term.select(c1, r1, length); } catch (e) {}
    }
  }

  // 选择模式下，用捕获阶段接管触摸事件，做真实的拖选
  const termsContainer = document.getElementById('terms');

  termsContainer.addEventListener('touchstart', function (e) {
    if (!selectMode) return;
    if (e.touches.length !== 1) return;
    const touch = e.touches[0];
    const pos = posFromPoint(touch.clientX, touch.clientY);
    if (!pos) return;
    dragStart = pos;
    e.preventDefault();
    e.stopPropagation();
  }, { capture: true, passive: false });

  termsContainer.addEventListener('touchmove', function (e) {
    if (!selectMode || !dragStart) return;
    if (e.touches.length !== 1) return;
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (!t) return;
    const touch = e.touches[0];
    const pos = posFromPoint(touch.clientX, touch.clientY);
    if (!pos) return;
    applySelection(t.term, dragStart, pos);
    e.preventDefault();
    e.stopPropagation();
  }, { capture: true, passive: false });

  termsContainer.addEventListener('touchend', function (e) {
    if (!selectMode) return;
    dragStart = null;
  }, { capture: true });

  // ------------------------ 窗口尺寸 ------------------------

  let timer = null;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (activeId === null) return;
      const t = terms.get(activeId);
      if (!t) return;
      try { t.fit.fit(); } catch (e) {}
      call('resize', activeId, t.term.cols, t.term.rows);
    }, 150);
  });

  document.addEventListener('click', function () {
    if (selectMode) return;
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (t) t.term.focus();
  });

  call('pageReady');
</script>
</body>
</html>
