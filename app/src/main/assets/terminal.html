<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #121212; overflow: hidden; }
  #terms { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .term {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    padding: 4px; box-sizing: border-box; display: none;
  }
  .term.active { display: block; }

  /* ★ 文本选择层：覆盖在 xterm 之上，正常模式不接管触摸 */
  .text-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    opacity: 0.01;               /* 不是 0，某些 WebView 对 opacity:0 不响应长按 */
    color: transparent;
    white-space: pre;
    overflow: hidden;
    z-index: 10;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.2;
    margin: 0;
    padding: 0;
  }
  .text-layer.selecting {
    pointer-events: auto;
    user-select: text;
    -webkit-user-select: text;
  }
  .text-layer .tl-row {
    white-space: pre;
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: inherit;
    font-size: inherit;
  }
</style>
</head>
<body>
<div id="terms"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script>
  // -------------------------------------------------- 全局状态
  const terms = new Map();
  let activeId = null;
  let selectMode = false;

  function call(fn) {
    var b = window.Android;
    if (!b || typeof b[fn] !== 'function') return;
    try { b[fn].apply(b, Array.prototype.slice.call(arguments, 1)); } catch (e) {}
  }

  // 兼容 v4/v5 的 option 读取
  function getOpt(term, key, def) {
    try {
      if (term.options && typeof term.options[key] !== 'undefined') return term.options[key];
      if (typeof term.getOption === 'function') {
        var v = term.getOption(key);
        if (typeof v !== 'undefined') return v;
      }
    } catch (e) {}
    return def;
  }

  // 从 xterm 内部读单元格尺寸（宽/高）
  function getCellDims(term) {
    try {
      var core = term._core || term.core;
      var dims = core && core._renderService && core._renderService.dimensions;
      if (dims && dims.css && dims.css.cell) {
        return { w: dims.css.cell.width, h: dims.css.cell.height };
      }
    } catch (e) {}
    return null;
  }

  // -------------------------------------------------- 终端生命周期

  function createTerm(rawId) {
    const id = String(rawId);
    if (terms.has(id)) return;

    const div = document.createElement('div');
    div.className = 'term';
    document.getElementById('terms').appendChild(div);

    const term = new Terminal({
      fontSize: 13,
      fontFamily: 'monospace',
      cursorBlink: true,
      scrollback: 5000,
      theme: { background: '#121212', foreground: '#d4d4d4' }
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(div);

    const ta = term.textarea;
    if (ta) {
      ta.setAttribute('autocorrect', 'off');
      ta.setAttribute('autocapitalize', 'off');
      ta.setAttribute('autocomplete', 'off');
      ta.setAttribute('spellcheck', 'false');
    }

    // 用户输入 -> Kotlin
    term.onData(function (d) { call('input', id, d); });

    // ★ 建文本层
    const layer = document.createElement('div');
    layer.className = 'text-layer';
    div.appendChild(layer);

    const entry = {
      term: term,
      fit: fit,
      div: div,
      layer: layer,
      rowEls: [],
      cols: 0,
      rows: 0,
      fontSize: 0,
      lineHeight: 0,
    };
    terms.set(id, entry);

    // 各种渲染/滚动事件都触发同步
    if (typeof term.onRender === 'function')     term.onRender(function ()     { syncTextLayer(id); });
    if (typeof term.onWriteParsed === 'function') term.onWriteParsed(function () { syncTextLayer(id); });
    if (typeof term.onScroll === 'function')     term.onScroll(function ()     { syncTextLayer(id); });
    if (typeof term.onResize === 'function')     term.onResize(function ()     { syncTextLayer(id); });

    if (activeId === null) {
      activeId = id;
      div.classList.add('active');
      try { fit.fit(); } catch (e) {}
      term.focus();
    } else {
      try { fit.fit(); } catch (e) {}
    }

    // 把文本层塞进 .xterm-screen，共用同一坐标系
    mountLayerInto(entry);
    syncTextLayer(id);

    call('ready', id, term.cols, term.rows);
  }

  function switchTerm(rawId) {
    const id = String(rawId);
    const t = terms.get(id);
    if (!t) return;
    activeId = id;
    terms.forEach(function (v, k) {
      if (k === id) v.div.classList.add('active');
      else v.div.classList.remove('active');
    });
    try { t.fit.fit(); } catch (e) {}
    t.term.focus();
    mountLayerInto(t);
    syncTextLayer(id);
    call('resize', id, t.term.cols, t.term.rows);
  }

  function closeTerm(rawId) {
    const id = String(rawId);
    const t = terms.get(id);
    if (!t) return;
    try { t.term.dispose(); } catch (e) {}
    t.div.remove();
    terms.delete(id);
    if (activeId === id) activeId = null;
  }

  // 把 layer 挂到 .xterm-screen 里，自动撑满
  function mountLayerInto(t) {
    try {
      const screen = t.div.querySelector('.xterm-screen');
      if (!screen) return;
      if (t.layer.parentElement !== screen) {
        screen.appendChild(t.layer);
      }
      t.layer.style.position = 'absolute';
      t.layer.style.left = '0';
      t.layer.style.top = '0';
      t.layer.style.right = '0';
      t.layer.style.bottom = '0';
    } catch (e) {}
  }

  // -------------------------------------------------- 文本层同步

  function syncTextLayer(rawId) {
    const id = String(rawId);
    const t = terms.get(id);
    if (!t) return;
    // 用户正在选择：不打断
    if (t.layer.classList.contains('selecting')) return;
    const term = t.term;

    const fs = getOpt(term, 'fontSize', 13);
    const fam = getOpt(term, 'fontFamily', 'monospace');
    const dims = getCellDims(term);
    const lineHeight = dims ? dims.h : Math.round(fs * 1.2);

    // 行列变化：重建行 div
    if (t.cols !== term.cols || t.rows !== term.rows) {
      rebuildRowEls(t, term.rows, lineHeight);
      t.cols = term.cols;
      t.rows = term.rows;
    }

    // 字体或行高变化：更新样式
    if (t.fontSize !== fs || t.lineHeight !== lineHeight) {
      t.layer.style.fontFamily = fam;
      t.layer.style.fontSize = fs + 'px';
      t.layer.style.lineHeight = lineHeight + 'px';
      for (let i = 0; i < t.rowEls.length; i++) {
        t.rowEls[i].style.lineHeight = lineHeight + 'px';
        t.rowEls[i].style.height = lineHeight + 'px';
      }
      t.fontSize = fs;
      t.lineHeight = lineHeight;
    }

    // 填内容
    const buf = term.buffer.active;
    const viewportY = buf.viewportY;
    for (let r = 0; r < term.rows; r++) {
      const line = buf.getLine(viewportY + r);
      const text = line ? line.translateToString(true) : '';
      const el = t.rowEls[r];
      if (el && el.textContent !== text) {
        el.textContent = text;
      }
    }
  }

  function rebuildRowEls(t, rows, lineHeight) {
    t.layer.innerHTML = '';
    t.rowEls = [];
    for (let r = 0; r < rows; r++) {
      const row = document.createElement('div');
      row.className = 'tl-row';
      row.style.lineHeight = lineHeight + 'px';
      row.style.height = lineHeight + 'px';
      t.layer.appendChild(row);
      t.rowEls.push(row);
    }
  }

  // -------------------------------------------------- 输出

  function w(rawId, b64) {
    const t = terms.get(String(rawId));
    if (!t) return;
    const s = atob(b64);
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    t.term.write(u);
    // 下一帧再同步一次，xterm 渲染完成后
    setTimeout(function () { syncTextLayer(rawId); }, 0);
  }

  function pasteActive(text) {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (t) t.term.paste(text);
  }

  function clearActive() {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (t) t.term.clear();
  }

  function copyAllActive() {
    if (activeId === null) { call('onToast', '没有终端'); return; }
    const t = terms.get(activeId);
    if (!t) return;
    // 先取文本层全部文本（含换行）
    const all = t.layer.innerText || t.layer.textContent || '';
    if (all) {
      call('onSelection', all);
      return;
    }
    // 回退到 xterm
    t.term.selectAll();
    const s = t.term.getSelection();
    t.term.clearSelection();
    if (s) call('onSelection', s);
    else call('onToast', '无内容可复制');
  }

  function copySelectionActive() {
    // 1) 浏览器原生选择（选择模式下的拖选）
    let nativeSel = '';
    try { nativeSel = window.getSelection().toString(); } catch (e) {}
    if (nativeSel) {
      call('onSelection', nativeSel);
      return;
    }
    // 2) xterm 自己那套选择
    if (activeId === null) { call('onToast', '没有终端'); return; }
    const t = terms.get(activeId);
    if (!t) return;
    const s = t.term.getSelection();
    if (s) call('onSelection', s);
    else call('onToast', '没有选中内容，先拖动选择');
  }

  function arrowActive(c) {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (!t) return;
    var app = t.term.modes.applicationCursorKeysMode;
    if (app === undefined) app = t.term.modes.applicationCursorKeys;
    call('key', activeId, (app ? '\x1bO' : '\x1b[') + c);
  }

  function fontDeltaActive(d) {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (!t) return;
    const cur = getOpt(t.term, 'fontSize', 13);
    const s = Math.max(8, Math.min(28, cur + d));
    try { t.term.options.fontSize = s; } catch (e) {}
    try { t.fit.fit(); } catch (e) {}
    // 强制下次 sync 时更新样式
    t.fontSize = 0;
    mountLayerInto(t);
    syncTextLayer(activeId);
    call('resize', activeId, t.term.cols, t.term.rows);
  }

  // -------------------------------------------------- 选择模式

  function enterSelectMode() {
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (!t) return;

    // 刷新一次，保证文本层是最新的
    syncTextLayer(activeId);

    selectMode = true;

    // 清掉 xterm 自己的选择
    try { t.term.clearSelection(); } catch (e) {}
    try { window.getSelection().removeAllRanges(); } catch (e) {}

    // ★ 开启文本层的原生选择
    mountLayerInto(t);
    t.layer.classList.add('selecting');
  }

  function exitSelectMode() {
    if (!selectMode) return;
    selectMode = false;
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    terms.forEach(function (t) {
      t.layer.classList.remove('selecting');
    });
    // 退出后同步一次
    if (activeId !== null) syncTextLayer(activeId);
  }

  // -------------------------------------------------- 窗口尺寸

  let timer = null;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (activeId === null) return;
      const t = terms.get(activeId);
      if (!t) return;
      try { t.fit.fit(); } catch (e) {}
      mountLayerInto(t);
      syncTextLayer(activeId);
      call('resize', activeId, t.term.cols, t.term.rows);
    }, 150);
  });

  document.addEventListener('click', function () {
    if (selectMode) return;
    if (activeId === null) return;
    const t = terms.get(activeId);
    if (t) t.term.focus();
  });

  call('pageReady');
</script>
</body>
</html>
